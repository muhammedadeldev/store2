<!doctype html>
<html lang="ar" dir="rtl" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <!-- Browser extension & executor fetch compatibility shim -->
    <script>
      (function() {
        try {
          var origFetch = window.fetch;
          var _customFetch = origFetch ? origFetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _customFetch;
            },
            set: function(newFetch) {
              _customFetch = newFetch;
            },
            configurable: true,
            enumerable: true
          });
        } catch (_) {}

        // Prevent external browser extension errors from breaking application execution
        window.addEventListener('error', function(event) {
          if (
            (event.filename && event.filename.indexOf('chrome-extension://') !== -1) ||
            (event.error && event.error.stack && event.error.stack.indexOf('chrome-extension://') !== -1)
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (
            event.reason &&
            event.reason.stack &&
            event.reason.stack.indexOf('chrome-extension://') !== -1
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();
    </script>
    <title>EIGHTY-EIGHT | Contemporary Egyptian Fashion</title>
    <meta name="description" content="منصة متجر EIGHTY-EIGHT للأزياء والملابس العصرية الراقية - خامات قطن مصري 100%، شحن سريع لجميع المحافظات ودفع عند الاستلام." />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
